<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administración · Tejiendo Vida</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- ===== LOGIN ===== -->
  <div id="loginView" class="login-view hidden">
    <div class="login-card">
      <div class="login-logo">Tejiendo<span>Vida</span></div>
      <p class="login-sub">Panel de administración</p>
      <form id="loginForm">
        <label for="loginPass">Contraseña</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" />
        <p id="loginError" class="login-error hidden">Contraseña incorrecta.</p>
        <button type="submit" class="btn btn-primario btn-block">Entrar</button>
      </form>
    </div>
  </div>

  <!-- ===== PANEL ===== -->
  <div id="panelView" class="panel-view hidden">

    <header class="admin-header">
      <div class="admin-header-inner">
        <div class="admin-logo">Tejiendo<span>Vida</span> <span class="admin-badge">Admin</span></div>
        <div class="admin-header-actions">
          <button type="button" id="btnPreview" class="btn btn-secundario btn-sm">👁 Vista previa</button>
          <a class="btn btn-secundario btn-sm" href="index.html" target="_blank">Abrir sitio</a>
          <button type="button" id="btnLogout" class="btn btn-outline btn-sm">Salir</button>
        </div>
      </div>
    </header>

    <!-- Estado de conexión -->
    <div id="estadoConexion" class="conexion"></div>

    <!-- Vista previa del sitio -->
    <div id="previewDrawer" class="preview-drawer hidden">
      <div class="preview-bar">
        <span class="preview-titulo">👁 Vista previa del sitio</span>
        <div class="preview-acciones">
          <button type="button" id="btnRecargar" class="btn btn-outline btn-sm">🔄 Recargar</button>
          <button type="button" id="btnCerrarPreview" class="btn btn-peligro btn-sm">Cerrar</button>
        </div>
      </div>
      <iframe id="previewFrame" src="index.html" title="Vista previa del sitio"></iframe>
    </div>

    <div class="admin-body">
      <!-- Navegación de secciones -->
      <nav class="admin-tabs" id="adminTabs"></nav>

      <main class="admin-main">
        <div class="admin-toolbar">
          <h1 id="tituloSeccion"></h1>
          <button type="button" id="btnNuevo" class="btn btn-primario btn-sm">+ Añadir nuevo</button>
        </div>

        <!-- Mensajes -->
        <div id="mensaje" class="mensaje hidden"></div>

        <!-- Formulario de creación/edición -->
        <div id="formulario" class="form-card hidden">
          <h3 id="tituloFormulario"></h3>
          <div id="camposForm"></div>
          <div class="form-actions">
            <button type="button" id="btnGuardar" class="btn btn-primario btn-sm">Guardar</button>
            <button type="button" id="btnCancelar" class="btn btn-outline btn-sm">Cancelar</button>
          </div>
        </div>

        <!-- Lista -->
        <div id="listaContainer"></div>
      </main>
    </div>

    <!-- Notificación flotante (toast) -->
    <div id="toast" class="toast hidden">
      <div class="toast-icon" id="toastIcon">✅</div>
      <div class="toast-body">
        <strong id="toastTitulo"></strong>
        <span id="toastMsg"></span>
      </div>
      <button type="button" id="toastClose" class="toast-close" aria-label="Cerrar">✕</button>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
